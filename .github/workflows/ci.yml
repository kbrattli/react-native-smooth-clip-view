name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  merge_group:
    types:
      - checks_requested

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      - name: Lint files
        run: npm run lint

      - name: Typecheck files
        run: npm run typecheck

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      - name: Run unit tests
        run: npm test -- --maxWorkers=2 --coverage

  build-library:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build package
        run: npm run prepare

      - name: Validate npm package contents
        run: npm pack --dry-run --json

  android-native:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 17

      - name: Setup
        uses: ./.github/actions/setup

      - name: Run Kotlin unit tests
        run: npm run test:android

      - name: Build Android native library (arm64 debug)
        working-directory: example/android
        run: >-
          ./gradlew :react-native-smooth-clip-view:externalNativeBuildDebug
          -PreactNativeArchitectures=arm64-v8a

      - name: Build Android native library (all release ABIs)
        working-directory: example/android
        run: >-
          ./gradlew :react-native-smooth-clip-view:externalNativeBuildRelease
          -PreactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64

  ios-native:
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      - name: Install CocoaPods dependencies
        working-directory: example/ios
        run: pod install

      # The test-spec scheme is generated by `pod install` into
      # Pods.xcodeproj/xcuserdata/<user>.xcuserdatad, not xcshareddata, so it
      # exists only because pod install and xcodebuild run as the same user
      # here. Assert it up front: a CocoaPods change that moves or renames it
      # should fail as "scheme missing", not as an opaque build error.
      - name: Verify the XCTest scheme exists
        working-directory: example/ios
        run: >-
          xcodebuild -workspace SmoothClipViewExample.xcworkspace -list
          | sed 's/^ *//' | grep -qx 'SmoothClipView-Unit-Tests'

      # Resolve a concrete simulator rather than pinning a device name: a
      # runner-image bump that drops "iPhone 17 Pro" would otherwise fail as an
      # opaque build error. `xcodebuild test` has no generic-destination form —
      # generic/platform=iOS Simulator is build-only — so a udid it is.
      - name: Select an available iOS simulator
        id: simulator
        run: |
          udid=$(xcrun simctl list devices available --json | python3 -c '
          import json, re, sys
          devices = json.load(sys.stdin)["devices"]
          def version(runtime):
              # Numeric, newest first: lexicographic sorting would rank
              # "iOS-9" above "iOS-26".
              match = re.search(r"iOS-([0-9]+(?:-[0-9]+)*)$", runtime)
              return tuple(int(part) for part in match.group(1).split("-"))
          runtimes = [
              key for key in devices
              if re.search(r"\.iOS-[0-9]+(?:-[0-9]+)*$", key)
          ]
          for runtime in sorted(runtimes, key=version, reverse=True):
              for device in devices[runtime]:
                  if device.get("isAvailable") and "iPhone" in device["name"]:
                      print(device["udid"])
                      sys.exit(0)
          sys.exit("no available iOS simulator")
          ')
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - name: Run XCTest suite
        working-directory: example/ios
        run: >-
          xcodebuild test
          -workspace SmoothClipViewExample.xcworkspace
          -scheme SmoothClipView-Unit-Tests
          -destination "id=${{ steps.simulator.outputs.udid }}"
          CODE_SIGNING_ALLOWED=NO
