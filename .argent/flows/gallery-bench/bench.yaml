# Start-latency benchmark (docs/gallery-mount-time.md): the start-latency
# bench switch on (every variant runs choreography's 500 ms cubic ease-out),
# then per variant 3 warm-up cycles and 10 measured ones, all eight variants
# in one recording. The flights come first: on iOS, timing.mjs
# calibrates the recording's clock with their runs.
# Cells: flight-warm/0:3:easeOutCubic,flight/0:10:easeOutCubic,flight-tp-warm/0:3:easeOutCubic,flight-tp/0:10:easeOutCubic,set-warm/0:3:easeOutCubic,set/0:10:easeOutCubic,measure-warm/0:3:easeOutCubic,measure/0:10:easeOutCubic,measure-tp-warm/0:3:easeOutCubic,measure-tp/0:10:easeOutCubic,st-warm/0:3:easeOutCubic,st/0:10:easeOutCubic,st-tp-warm/0:3:easeOutCubic,st-tp/0:10:easeOutCubic,choreo-warm/0:3:easeOutCubic,choreo/0:10:easeOutCubic
steps:
  - run: hub
  - run: start-bench-on
  - run: enter-flight
  - run: warmup
  - run: cycles
  - run: exit
  - run: enter-flight-teleport
  - run: warmup
  - run: cycles
  - run: exit
  - run: enter-set
  - run: warmup
  - run: cycles
  - run: exit
  - run: enter-measure
  - run: warmup
  - run: cycles
  - run: exit
  - run: enter-measure-teleport
  - run: warmup
  - run: cycles
  - run: exit
  - run: enter-transitions
  - run: warmup
  - run: cycles
  - run: exit
  - run: enter-transitions-teleport
  - run: warmup
  - run: cycles
  - run: exit
  - run: enter-choreography
  - run: warmup
  - run: cycles
  - run: exit
  - run: start-bench-off
