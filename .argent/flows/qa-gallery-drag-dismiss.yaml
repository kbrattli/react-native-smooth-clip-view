steps:
  - echo: Restart SmoothClip example. Expect the home screen baseline.
  - launch: smoothclipview.example
  - when:
      visible: { text: Continue }
    steps:
      - echo: Dismiss the optional Expo development-build introduction.
      - tap: { text: Continue }
      - await: { hidden: { text: Continue } }
  - await: { visible: { id: route-card-image-gallery }, timeout: 10000 }
  - await: { idle: true }
  - echo: On Home, open Image gallery. Expect the gallery grid.
  - tap: { id: route-card-image-gallery }
  - await:
      visible: { id: gallery-tile-coastal-overlook }
      timeout: 10000
  - await: { idle: true }
  - echo: On Gallery, open the first tile. Expect the full-screen coastal page.
  - tap: { id: gallery-tile-coastal-overlook }
  - await:
      visible: { id: gallery-page-coastal-overlook }
      timeout: 10000
  - await: { idle: true }
  - echo: Drag briefly below the dismiss threshold. Expect a rapid reversal to the same page.
  - tool: gesture-swipe
    args:
      fromX: 0.5
      fromY: 0.45
      toX: 0.52
      toY: 0.55
      durationMs: 600
      settle: true
  - await:
      visible: { id: gallery-page-coastal-overlook }
      timeout: 5000
  - echo: Drag beyond the dismiss threshold. Expect the overlay to close onto the original tile.
  - tool: gesture-swipe
    args:
      fromX: 0.5
      fromY: 0.43
      toX: 0.55
      toY: 0.76
      durationMs: 700
      settle: true
  - await:
      hidden: { id: gallery-page-coastal-overlook }
      timeout: 10000
  - await:
      visible: { id: gallery-tile-coastal-overlook }
      timeout: 10000
  - await: { idle: true }
